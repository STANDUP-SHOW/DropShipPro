<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- La même icône que l'extension Chrome (le cube sur dégradé violet-rose),
         demandé le 06/09/2026 : un seul visage dans l'onglet, la barre Chrome
         et les résultats Google. Le 48 px est la taille que Google lit. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128.png" />
    <link rel="apple-touch-icon" href="/favicon-128.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Importez un produit depuis n'importe quelle boutique, laissez l'IA réécrire l'annonce et publiez-la sur vos marketplaces." />

    <!--
      Le site est en français, et il faut le dire trois fois.

      `lang="en"` traînait depuis le gabarit de Vite : Chrome concluait que la
      page était anglaise, proposait de la traduire, et rendait une traduction
      automatique du français vers le français — c'est-à-dire un charabia, sur
      une application par ailleurs parfaitement lisible.

      `lang` suffit à Chrome. Les deux autres balises servent aux réseaux
      sociaux et aux moteurs, qui ne lisent pas l'attribut de `<html>`.
    -->
    <meta property="og:locale" content="fr_FR" />
    <meta http-equiv="Content-Language" content="fr" />

    <title>DropShipper IA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
