<!doctype html>
<html lang="fr" data-theme="noir">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boutique</title>
    <style>
      /*
       * La vitrine générique, seconde génération (07/09/2026).
       *
       * Refondue sur le modèle d'oguss.fr — la boutique Lovable de Max reliée
       * à notre flux : héro plein écran, chiffres, catégories créées depuis le
       * flux, nouveautés, fiche produit, panier, commande. Une seule page pour
       * toutes les boutiques : elle reçoit sa clé, va chercher son thème et
       * son catalogue, et n'embarque ni produit ni couleur.
       *
       * Quatre modes visiteur pilotés par [data-theme] sur <html> — noir,
       * clair, gradient, colorful — exactement la mécanique d'oguss : des
       * jetons CSS par mode, l'accent venant du thème choisi par le marchand.
       */
      :root {
        --accent: #8b5cf6;
        --accent-2: #38bdf8;
        --radius: 16px;
        --sans: system-ui, -apple-system, sans-serif;
        --display: var(--sans);
      }

      [data-theme='noir'] {
        --bg: #0b0b10;
        --bg-2: #12121a;
        --surface: rgba(255, 255, 255, 0.05);
        --surface-2: rgba(255, 255, 255, 0.09);
        --line: rgba(255, 255, 255, 0.12);
        --text: #f4f4f6;
        --muted: #9a9aad;
        --hero: radial-gradient(120% 90% at 70% 10%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 60%), #0b0b10;
      }
      [data-theme='clair'] {
        --bg: #f7f6f3;
        --bg-2: #ffffff;
        --surface: #ffffff;
        --surface-2: #f0efeb;
        --line: rgba(20, 20, 30, 0.12);
        --text: #17171f;
        --muted: #6b6b7a;
        --hero: radial-gradient(120% 90% at 70% 10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%), #f7f6f3;
      }
      [data-theme='gradient'] {
        --bg: #0d0b1a;
        --bg-2: #141126;
        --surface: rgba(255, 255, 255, 0.06);
        --surface-2: rgba(255, 255, 255, 0.1);
        --line: rgba(255, 255, 255, 0.14);
        --text: #f6f4ff;
        --muted: #a8a3c2;
        --hero: linear-gradient(135deg, color-mix(in srgb, var(--accent) 55%, #0d0b1a), color-mix(in srgb, var(--accent-2) 45%, #0d0b1a));
      }
      [data-theme='colorful'] {
        --bg: #fdf7ef;
        --bg-2: #ffffff;
        --surface: #ffffff;
        --surface-2: #fff3e2;
        --line: rgba(30, 20, 10, 0.14);
        --text: #241a10;
        --muted: #8a7a66;
        --hero: linear-gradient(120deg, color-mix(in srgb, var(--accent) 30%, #fdf7ef), color-mix(in srgb, var(--accent-2) 35%, #fdf7ef));
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      img { display: block; max-width: 100%; }
      button { font: inherit; cursor: pointer; }
      a { color: inherit; }
      .wrap { width: min(1240px, 94vw); margin-inline: auto; }

      /* ---------- Header ---------- */
      header.site {
        position: sticky; top: 0; z-index: 40;
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .barre { display: flex; align-items: center; gap: 14px; padding: 12px 0; }
      .enseigne { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; text-decoration: none; font-family: var(--display); }
      .enseigne img { width: 34px; height: 34px; border-radius: 9px; object-fit: cover; }
      .nav { display: none; gap: 4px; }
      @media (min-width: 860px) { .nav { display: flex; } }
      .nav a { padding: 7px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); text-decoration: none; }
      .nav a:hover, .nav a.actif { color: var(--text); background: var(--surface-2); }
      .droite { margin-left: auto; display: flex; align-items: center; gap: 8px; }
      .modes { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
      .modes button { border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 999px; }
      .modes button[aria-pressed='true'] { color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
      .panier-btn {
        display: flex; align-items: center; gap: 7px;
        border: 1px solid var(--line); background: var(--surface); color: var(--text);
        padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; text-decoration: none;
      }
      .panier-btn .compte { min-width: 20px; height: 20px; display: inline-grid; place-items: center; border-radius: 999px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 800; }

      /* ---------- Héro ---------- */
      .hero { background: var(--hero); border-bottom: 1px solid var(--line); }
      .hero-in { padding: 64px 0 46px; text-align: center; }
      .hero .sur { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
      .hero h1 { margin: 12px auto 0; max-width: 18em; font-size: clamp(30px, 5vw, 52px); line-height: 1.08; font-family: var(--display); font-weight: 800; }
      .hero p { margin: 16px auto 0; max-width: 42em; color: var(--muted); font-size: 15px; line-height: 1.6; }
      .cta {
        display: inline-block; margin-top: 24px; padding: 13px 28px; border-radius: 999px; border: 0;
        background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; font-weight: 700; font-size: 15px; text-decoration: none;
      }
      .chiffres { display: flex; flex-wrap: wrap; justify-content: center; gap: 34px; padding: 22px 0 30px; }
      .chiffres div { text-align: center; }
      .chiffres b { display: block; font-size: 24px; font-family: var(--display); }
      .chiffres span { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

      /* ---------- Sections ---------- */
      section.bloc { padding: 42px 0 10px; }
      .titre-bloc { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      .titre-bloc h2 { margin: 0; font-size: 24px; font-family: var(--display); }
      .titre-bloc p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
      .titre-bloc a { font-size: 13px; color: var(--muted); text-decoration: none; white-space: nowrap; }
      .titre-bloc a:hover { color: var(--text); }

      .grille-cats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); margin-top: 18px; }
      .carte-cat {
        display: block; text-decoration: none; padding: 18px; border-radius: var(--radius);
        border: 1px solid var(--line); background: var(--surface);
      }
      .carte-cat:hover { background: var(--surface-2); }
      .carte-cat b { display: block; font-size: 15px; }
      .carte-cat span { font-size: 12px; color: var(--muted); }

      .grille { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); margin-top: 18px; }
      .carte {
        display: flex; flex-direction: column; text-decoration: none; overflow: hidden;
        border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface);
        transition: transform 0.15s ease;
      }
      .carte:hover { transform: translateY(-3px); background: var(--surface-2); }
      .carte .visuel { aspect-ratio: 1; background: var(--bg-2); }
      .carte .visuel img { width: 100%; height: 100%; object-fit: cover; }
      .carte .visuel .vide { width: 100%; height: 100%; display: grid; place-items: center; color: var(--muted); font-size: 34px; }
      .carte .infos { padding: 12px 13px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
      .carte .rayon { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
      .carte .nom { font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
      .carte .bas { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
      .carte .prix { font-weight: 800; font-size: 16px; font-family: var(--display); }
      .carte .voir { font-size: 12px; color: var(--accent-2); font-weight: 600; }

      /* ---------- Outils de liste ---------- */
      .outils { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
      .outils input, .outils select {
        border: 1px solid var(--line); background: var(--surface); color: var(--text);
        border-radius: 12px; padding: 9px 12px; font-size: 13px; outline: none;
      }
      .outils input { flex: 1; min-width: 180px; }
      .puces { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
      .puces a { text-decoration: none; font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
      .puces a.actif { color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-color: transparent; }

      /* ---------- Fiche produit ---------- */
      .fiche { display: grid; gap: 26px; margin-top: 22px; }
      @media (min-width: 900px) { .fiche { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); } }
      .galerie .grand { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--bg-2); aspect-ratio: 1; }
      .galerie .grand img { width: 100%; height: 100%; object-fit: contain; }
      .vignettes { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
      .vignettes button { padding: 0; border: 2px solid transparent; border-radius: 10px; overflow: hidden; background: var(--bg-2); flex: 0 0 62px; height: 62px; }
      .vignettes button.actif { border-color: var(--accent); }
      .vignettes img { width: 100%; height: 100%; object-fit: cover; }
      .fiche h1 { margin: 0; font-size: 24px; line-height: 1.25; font-family: var(--display); }
      .fiche .prix-ligne { display: flex; align-items: baseline; gap: 12px; margin-top: 14px; }
      .fiche .prix-ligne b { font-size: 30px; font-family: var(--display); }
      .fiche .desc { margin-top: 16px; color: var(--muted); font-size: 14px; line-height: 1.7; white-space: pre-line; }
      .points { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
      .points li { display: flex; gap: 9px; font-size: 13.5px; line-height: 1.5; }
      .points li::before { content: '✓'; color: var(--accent-2); font-weight: 800; }
      .attributs { margin-top: 18px; display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
      .attributs div { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 11px; font-size: 12.5px; }
      .attributs span { color: var(--muted); }
      .achat { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 22px; }
      .qte { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
      .qte button { width: 36px; height: 40px; border: 0; background: transparent; color: var(--text); font-size: 17px; }
      .qte output { min-width: 30px; text-align: center; font-weight: 700; }
      .rassure { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }

      /* ---------- Panier / commande ---------- */
      .lignes { margin-top: 18px; display: grid; gap: 10px; }
      .ligne {
        display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center;
        border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 10px 12px;
      }
      .ligne img, .ligne .vide { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--bg-2); display: grid; place-items: center; color: var(--muted); }
      .ligne .nom { font-size: 13.5px; line-height: 1.35; }
      .ligne .sous { color: var(--muted); font-size: 12px; margin-top: 3px; }
      .ligne .retirer { border: 0; background: transparent; color: var(--muted); font-size: 12px; text-decoration: underline; padding: 0; margin-top: 5px; }
      .total {
        margin-top: 18px; border: 1px solid var(--line); background: var(--surface);
        border-radius: var(--radius); padding: 16px; max-width: 430px;
      }
      .total .l { display: flex; justify-content: space-between; font-size: 13.5px; padding: 4px 0; color: var(--muted); }
      .total .l.grand { color: var(--text); font-weight: 800; font-size: 17px; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 11px; }
      form.commande { display: grid; gap: 10px; margin-top: 18px; max-width: 520px; }
      form.commande input {
        border: 1px solid var(--line); background: var(--surface); color: var(--text);
        border-radius: 12px; padding: 11px 13px; font-size: 14px; outline: none; width: 100%;
      }
      form.commande .deux { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
      .note-livraison { font-size: 12px; color: var(--muted); }
      .ok-commande { margin-top: 26px; text-align: center; padding: 40px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
      .ok-commande b { font-size: 22px; font-family: var(--display); display: block; }

      /* ---------- Divers ---------- */
      .annonce { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; text-align: center; font-size: 12.5px; font-weight: 600; padding: 7px 12px; margin: 0; }
      .chargement, .vide-etat { padding: 70px 0; text-align: center; color: var(--muted); }
      footer.site { margin-top: 60px; border-top: 1px solid var(--line); background: var(--bg-2); }
      .pied { display: grid; gap: 26px; padding: 36px 0; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); font-size: 13px; }
      .pied b { display: block; margin-bottom: 9px; font-family: var(--display); }
      .pied a, .pied p { color: var(--muted); text-decoration: none; margin: 0 0 6px; display: block; }
      .pied a:hover { color: var(--text); }
      .fin { border-top: 1px solid var(--line); padding: 14px 0; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; }
      .retour { display: inline-block; margin-top: 18px; font-size: 13px; color: var(--muted); text-decoration: none; }
      .retour:hover { color: var(--text); }
    </style>
  </head>
  <body>
    <p class="annonce" id="annonce" hidden></p>
    <header class="site">
      <div class="wrap barre">
        <a class="enseigne" href="#/" id="enseigne"><span>Boutique</span></a>
        <nav class="nav" id="nav"></nav>
        <div class="droite">
          <div class="modes" id="modes" role="group" aria-label="Thème d'affichage"></div>
          <a class="panier-btn" href="#/panier">Panier <span class="compte" id="compte-panier">0</span></a>
        </div>
      </div>
    </header>

    <main id="page"><p class="chargement">Chargement…</p></main>

    <footer class="site" id="pied-site" hidden>
      <div class="wrap pied" id="pied"></div>
      <div class="wrap fin" id="fin"></div>
    </footer>

    <script>
      /*
       * Toute la vitrine vit ici, en JavaScript sans dépendance : la page est
       * servie par l'API à des centaines de boutiques, chaque kilooctet et
       * chaque requête comptent. L'échappement passe par texte() partout —
       * titres et descriptions viennent de sites tiers.
       */
      ;(function () {
        var CONF = window.BOUTIQUE || { api: '', shopKey: '' }
        var MODES = [
          ['noir', 'Noir'],
          ['clair', 'Clair'],
          ['gradient', 'Gradient'],
          ['colorful', 'Colorful'],
        ]
        var CLE_MODE = 'vitrine-mode'
        var CLE_PANIER = 'vitrine-panier-' + CONF.shopKey

        var apparence = null
        var produits = []
        var nomBoutique = 'Boutique'

        function texte(v) {
          return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
          })
        }
        function photo(u) {
          if (!u) return ''
          return u.indexOf('http') === 0 ? u : CONF.api + (u.charAt(0) === '/' ? '' : '/') + u
        }
        function prix(p) {
          var n = Number(p)
          return isNaN(n) ? '' : n.toFixed(2).replace('.', ',') + ' €'
        }

        /* ---------- Modes visiteur ---------- */
        function modeActuel() {
          try { return localStorage.getItem(CLE_MODE) || 'noir' } catch (e) { return 'noir' }
        }
        function poserMode(m) {
          document.documentElement.setAttribute('data-theme', m)
          try { localStorage.setItem(CLE_MODE, m) } catch (e) {}
          rendreModes()
        }
        function rendreModes() {
          var actif = modeActuel()
          document.getElementById('modes').innerHTML = MODES.map(function (m) {
            return '<button type="button" data-mode="' + m[0] + '" aria-pressed="' + (m[0] === actif) + '" title="Thème ' + m[1] + '">' + m[1] + '</button>'
          }).join('')
        }
        document.getElementById('modes').addEventListener('click', function (e) {
          var b = e.target.closest('button[data-mode]')
          if (b) poserMode(b.getAttribute('data-mode'))
        })
        poserMode(modeActuel())

        /* ---------- Panier (localStorage, par boutique) ---------- */
        function lirePanier() {
          try { return JSON.parse(localStorage.getItem(CLE_PANIER) || '[]') } catch (e) { return [] }
        }
        function ecrirePanier(p) {
          try { localStorage.setItem(CLE_PANIER, JSON.stringify(p)) } catch (e) {}
          var n = p.reduce(function (s, l) { return s + l.quantity }, 0)
          document.getElementById('compte-panier').textContent = n
        }
        function ajouterAuPanier(id, quantite) {
          var p = lirePanier()
          var ligne = p.find(function (l) { return l.productId === id })
          if (ligne) ligne.quantity = Math.min(20, ligne.quantity + quantite)
          else p.push({ productId: id, quantity: quantite })
          ecrirePanier(p)
        }
        ecrirePanier(lirePanier())

        /* ---------- Données ---------- */
        function rayonDe(p) {
          var c = (p.category || '').trim()
          if (!c) return 'Divers'
          return (c.split('>')[0] || '').trim() || 'Divers'
        }
        function rayons() {
          var compte = new Map()
          produits.forEach(function (p) {
            var r = rayonDe(p)
            compte.set(r, (compte.get(r) || 0) + 1)
          })
          return Array.from(compte).sort(function (a, b) { return b[1] - a[1] })
        }
        function parId(id) {
          return produits.find(function (p) { return p.id === id })
        }

        /* ---------- Pages ---------- */
        function carte(p) {
          var img = (p.images && p.images[0]) || ''
          return (
            '<a class="carte" href="#/p/' + encodeURIComponent(p.id) + '">' +
            '<span class="visuel">' + (img ? '<img loading="lazy" src="' + texte(photo(img)) + '" alt="" />' : '<span class="vide">🛍️</span>') + '</span>' +
            '<span class="infos">' +
            '<span class="rayon">' + texte(rayonDe(p)) + '</span>' +
            '<span class="nom">' + texte(p.title) + '</span>' +
            '<span class="bas"><span class="prix">' + prix(p.price) + '</span><span class="voir">Voir →</span></span>' +
            '</span></a>'
          )
        }

        function pageAccueil() {
          var c = (apparence && apparence.contenu) || {}
          var lesRayons = rayons()
          return (
            '<div class="hero"><div class="wrap hero-in">' +
            '<p class="sur">' + texte(nomBoutique) + '</p>' +
            '<h1>' + texte(c.accroche || '') + ' ' + texte(c.accrocheSuite || '') + '</h1>' +
            '<p>' + texte(c.sousTitre || '') + '</p>' +
            '<a class="cta" href="#/boutique">Découvrir la boutique</a>' +
            '<div class="chiffres">' +
            '<div><b>' + produits.length + '</b><span>produits en ligne</span></div>' +
            '<div><b>' + lesRayons.length + '</b><span>catégories</span></div>' +
            '<div><b>14 j</b><span>retours offerts</span></div>' +
            '</div></div></div>' +
            '<section class="bloc wrap"><div class="titre-bloc"><div><h2>Catégories</h2>' +
            '<p>Tout l\'univers ' + texte(nomBoutique) + ', créé automatiquement depuis le catalogue.</p></div></div>' +
            '<div class="grille-cats">' +
            lesRayons.map(function (r) {
              return '<a class="carte-cat" href="#/c/' + encodeURIComponent(r[0]) + '"><b>' + texte(r[0]) + '</b><span>' + r[1] + ' article(s)</span></a>'
            }).join('') +
            '</div></section>' +
            '<section class="bloc wrap"><div class="titre-bloc"><div><h2>Nouveautés</h2>' +
            '<p>Les dernières pièces arrivées en boutique.</p></div><a href="#/boutique">Tout voir →</a></div>' +
            '<div class="grille">' + produits.slice(0, 8).map(carte).join('') + '</div></section>'
          )
        }

        function pageListe(rayon, requete) {
          var terme = (requete || '').toLowerCase()
          var liste = produits.filter(function (p) {
            if (rayon && rayonDe(p) !== rayon) return false
            if (terme && (p.title || '').toLowerCase().indexOf(terme) === -1) return false
            return true
          })
          var titre = rayon ? rayon : 'Toute la boutique'
          return (
            '<section class="bloc wrap"><div class="titre-bloc"><div><h2>' + texte(titre) + '</h2>' +
            '<p>' + liste.length + ' article(s)</p></div></div>' +
            '<div class="outils"><input id="recherche" type="search" placeholder="Rechercher un article…" value="' + texte(requete || '') + '" /></div>' +
            '<div class="puces">' +
            '<a href="#/boutique" class="' + (rayon ? '' : 'actif') + '">Tout</a>' +
            rayons().map(function (r) {
              return '<a href="#/c/' + encodeURIComponent(r[0]) + '" class="' + (rayon === r[0] ? 'actif' : '') + '">' + texte(r[0]) + '</a>'
            }).join('') +
            '</div>' +
            (liste.length
              ? '<div class="grille">' + liste.map(carte).join('') + '</div>'
              : '<p class="vide-etat">Aucun article ne correspond.</p>') +
            '</section>'
          )
        }

        function pageProduit(id) {
          var p = parId(id)
          if (!p) return '<div class="wrap"><p class="vide-etat">Cet article n\'est plus en boutique.</p></div>'
          var c = (apparence && apparence.contenu) || {}
          var imgs = p.images || []
          var attrs = p.attributes || {}
          var clefs = Object.keys(attrs)
          return (
            '<section class="bloc wrap">' +
            '<a class="retour" href="#/boutique">← Continuer mes achats</a>' +
            '<div class="fiche">' +
            '<div class="galerie">' +
            '<div class="grand" id="grand">' + (imgs[0] ? '<img src="' + texte(photo(imgs[0])) + '" alt="" />' : '<span class="vide" style="display:grid;place-items:center;height:100%;font-size:44px">🛍️</span>') + '</div>' +
            (imgs.length > 1
              ? '<div class="vignettes">' + imgs.slice(0, 10).map(function (u, i) {
                  return '<button type="button" data-img="' + texte(photo(u)) + '" class="' + (i === 0 ? 'actif' : '') + '"><img src="' + texte(photo(u)) + '" alt="" /></button>'
                }).join('') + '</div>'
              : '') +
            '</div>' +
            '<div>' +
            '<p class="rayon" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0">' + texte(rayonDe(p)) + '</p>' +
            '<h1>' + texte(p.title) + '</h1>' +
            '<div class="prix-ligne"><b>' + prix(p.price) + '</b></div>' +
            '<div class="achat">' +
            '<span class="qte"><button type="button" id="moins">−</button><output id="qte">1</output><button type="button" id="plus">+</button></span>' +
            '<button class="cta" style="margin-top:0" id="ajouter" data-id="' + texte(p.id) + '">Ajouter au panier</button>' +
            '</div>' +
            '<p class="rassure">' +
            '<span>🚚 Livraison suivie' + (c.portOffertDes ? ' — offerte dès ' + prix(c.portOffertDes) : '') + '</span>' +
            '<span>↩️ Retours 14 jours</span><span>🔒 Paiement sécurisé</span></p>' +
            (p.bulletPoints && p.bulletPoints.length
              ? '<ul class="points">' + p.bulletPoints.slice(0, 7).map(function (b) { return '<li>' + texte(b) + '</li>' }).join('') + '</ul>'
              : '') +
            (p.description ? '<p class="desc">' + texte(p.description) + '</p>' : '') +
            (clefs.length
              ? '<div class="attributs">' + clefs.slice(0, 10).map(function (k) {
                  return '<div><span>' + texte(k) + ' : </span><b>' + texte(attrs[k]) + '</b></div>'
                }).join('') + '</div>'
              : '') +
            '</div></div></section>'
          )
        }

        function pagePanier() {
          var c = (apparence && apparence.contenu) || {}
          var p = lirePanier().map(function (l) { return { ligne: l, produit: parId(l.productId) } }).filter(function (x) { return x.produit })
          if (!p.length) {
            return '<section class="bloc wrap"><h2>Votre panier</h2><p class="vide-etat">Il est vide — la boutique n\'attend que vous.</p>' +
              '<p style="text-align:center"><a class="cta" href="#/boutique">Voir la boutique</a></p></section>'
          }
          var sousTotal = p.reduce(function (s, x) { return s + Number(x.produit.price) * x.ligne.quantity }, 0)
          var port = c.portOffertDes && sousTotal >= c.portOffertDes ? 0 : Number(c.fraisPort || 0)
          return (
            '<section class="bloc wrap"><h2>Votre panier</h2>' +
            '<div class="lignes">' +
            p.map(function (x) {
              var img = (x.produit.images && x.produit.images[0]) || ''
              return (
                '<div class="ligne">' +
                (img ? '<img src="' + texte(photo(img)) + '" alt="" />' : '<span class="vide">🛍️</span>') +
                '<div><div class="nom">' + texte(x.produit.title) + '</div>' +
                '<div class="sous">' + prix(x.produit.price) + ' × ' + x.ligne.quantity + '</div>' +
                '<button type="button" class="retirer" data-retirer="' + texte(x.ligne.productId) + '">Retirer</button></div>' +
                '<b>' + prix(Number(x.produit.price) * x.ligne.quantity) + '</b>' +
                '</div>'
              )
            }).join('') +
            '</div>' +
            '<div class="total">' +
            '<div class="l"><span>Sous-total</span><span>' + prix(sousTotal) + '</span></div>' +
            '<div class="l"><span>Livraison</span><span>' + (port ? prix(port) : 'Offerte') + '</span></div>' +
            (c.portOffertDes && port ? '<p class="note-livraison">Offerte dès ' + prix(c.portOffertDes) + ' d\'achat.</p>' : '') +
            '<div class="l grand"><span>Total</span><span>' + prix(sousTotal + port) + '</span></div>' +
            '</div>' +
            '<h2 style="margin-top:30px">Vos coordonnées</h2>' +
            '<form class="commande" id="form-commande">' +
            '<input name="name" required minlength="2" placeholder="Nom et prénom" />' +
            '<input name="email" type="email" placeholder="E-mail (pour le suivi)" />' +
            '<input name="street" required minlength="3" placeholder="Adresse" />' +
            '<div class="deux"><input name="zip" required placeholder="Code postal" /><input name="city" required placeholder="Ville" /></div>' +
            '<input name="phone" placeholder="Téléphone (facultatif)" />' +
            '<button class="cta" style="margin-top:6px" type="submit" id="commander">Passer commande</button>' +
            '<p class="note-livraison" id="erreur-commande" hidden></p>' +
            '</form></section>'
          )
        }

        function pageMerci(brut) {
          var n = Math.max(1, Number(brut) || 1)
          return (
            '<section class="bloc wrap"><div class="ok-commande">' +
            '<b>Merci pour votre commande ! 🎉</b>' +
            '<p style="color:var(--muted)">' + n + ' article(s) commandé(s). ' + texte(nomBoutique) + ' la prépare — vous serez contacté pour la livraison.</p>' +
            '<a class="cta" href="#/boutique">Revenir à la boutique</a>' +
            '</div></section>'
          )
        }

        /* ---------- Routing ---------- */
        function route() {
          var h = location.hash.replace(/^#\/?/, '')
          var page = document.getElementById('page')
          var morceaux = h.split('/')
          if (!h) page.innerHTML = pageAccueil()
          else if (morceaux[0] === 'boutique') page.innerHTML = pageListe(null, '')
          else if (morceaux[0] === 'c') page.innerHTML = pageListe(decodeURIComponent(morceaux[1] || ''), '')
          else if (morceaux[0] === 'p') page.innerHTML = pageProduit(decodeURIComponent(morceaux[1] || ''))
          else if (morceaux[0] === 'panier') page.innerHTML = pagePanier()
          else if (morceaux[0] === 'merci') page.innerHTML = pageMerci(decodeURIComponent(morceaux[1] || '1'))
          else page.innerHTML = pageAccueil()
          window.scrollTo(0, 0)
          rendreNav(morceaux[0] || '')
          brancher()
        }

        function rendreNav(actif) {
          var top = rayons().slice(0, 3)
          document.getElementById('nav').innerHTML =
            '<a href="#/" class="' + (actif === '' ? 'actif' : '') + '">Accueil</a>' +
            '<a href="#/boutique" class="' + (actif === 'boutique' ? 'actif' : '') + '">Boutique</a>' +
            top.map(function (r) { return '<a href="#/c/' + encodeURIComponent(r[0]) + '">' + texte(r[0]) + '</a>' }).join('')
        }

        function brancher() {
          var recherche = document.getElementById('recherche')
          if (recherche) {
            recherche.addEventListener('input', function () {
              var h = location.hash.replace(/^#\/?/, '').split('/')
              var rayon = h[0] === 'c' ? decodeURIComponent(h[1] || '') : null
              var grille = document.querySelector('.bloc .grille, .bloc .vide-etat')
              var html = pageListe(rayon, recherche.value)
              // Ne re-rend que la page en gardant le focus du champ.
              var bac = document.createElement('div')
              bac.innerHTML = html
              var neuve = bac.querySelector('.grille') || bac.querySelector('.vide-etat')
              if (grille && neuve) grille.replaceWith(neuve)
            })
          }
          var grand = document.getElementById('grand')
          document.querySelectorAll('.vignettes button').forEach(function (b) {
            b.addEventListener('click', function () {
              document.querySelectorAll('.vignettes button').forEach(function (x) { x.classList.remove('actif') })
              b.classList.add('actif')
              if (grand) grand.innerHTML = '<img src="' + texte(b.getAttribute('data-img')) + '" alt="" />'
            })
          })
          var qte = document.getElementById('qte')
          var plus = document.getElementById('plus')
          var moins = document.getElementById('moins')
          if (plus) plus.addEventListener('click', function () { qte.textContent = Math.min(20, Number(qte.textContent) + 1) })
          if (moins) moins.addEventListener('click', function () { qte.textContent = Math.max(1, Number(qte.textContent) - 1) })
          var ajouter = document.getElementById('ajouter')
          if (ajouter) {
            ajouter.addEventListener('click', function () {
              ajouterAuPanier(ajouter.getAttribute('data-id'), Number(qte.textContent))
              ajouter.textContent = 'Ajouté ✓'
              setTimeout(function () { ajouter.textContent = 'Ajouter au panier' }, 1300)
            })
          }
          document.querySelectorAll('[data-retirer]').forEach(function (b) {
            b.addEventListener('click', function () {
              ecrirePanier(lirePanier().filter(function (l) { return l.productId !== b.getAttribute('data-retirer') }))
              route()
            })
          })
          var form = document.getElementById('form-commande')
          if (form) {
            form.addEventListener('submit', function (e) {
              e.preventDefault()
              var bouton = document.getElementById('commander')
              var erreur = document.getElementById('erreur-commande')
              var fd = new FormData(form)
              bouton.disabled = true
              bouton.textContent = 'Envoi…'
              fetch(CONF.api + '/api/public/shops/' + CONF.shopKey + '/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  buyer: {
                    name: fd.get('name'),
                    email: fd.get('email') || undefined,
                    street: fd.get('street'),
                    zip: fd.get('zip'),
                    city: fd.get('city'),
                    phone: fd.get('phone') || undefined,
                  },
                  lignes: lirePanier(),
                }),
              })
                .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, corps: j } }) })
                .then(function (r) {
                  if (!r.ok) throw new Error(r.corps && r.corps.error ? r.corps.error : 'La commande n\'a pas pu partir.')
                  var n = lirePanier().reduce(function (s, l) { return s + l.quantity }, 0)
                  ecrirePanier([])
                  location.hash = '#/merci/' + n
                })
                .catch(function (e) {
                  erreur.hidden = false
                  erreur.textContent = e.message
                  bouton.disabled = false
                  bouton.textContent = 'Passer commande'
                })
            })
          }
        }

        /* ---------- Pied de page ---------- */
        function rendrePied() {
          var c = (apparence && apparence.contenu) || {}
          document.getElementById('pied-site').hidden = false
          document.getElementById('pied').innerHTML =
            '<div><b>' + texte(nomBoutique) + '</b><p>' + texte(c.sousTitre || '') + '</p></div>' +
            '<div><b>Catégories</b>' +
            rayons().slice(0, 6).map(function (r) { return '<a href="#/c/' + encodeURIComponent(r[0]) + '">' + texte(r[0]) + '</a>' }).join('') +
            '</div>' +
            '<div><b>Service client</b><p>Retours offerts sous 14 jours</p><p>Livraison suivie</p><p>Paiement sécurisé</p></div>'
          document.getElementById('fin').innerHTML =
            '<span>© ' + new Date().getFullYear() + ' ' + texte(nomBoutique) + '</span><span>Boutique propulsée par DropShipper IA</span>'
        }

        /* ---------- Chargement ---------- */
        var base = CONF.api + '/api/public/shops/' + CONF.shopKey
        var essai = new URLSearchParams(location.search).get('theme')
        Promise.all([
          fetch(base + '/theme' + (essai ? '?theme=' + encodeURIComponent(essai) : '')).then(function (r) { return r.json() }),
          fetch(base + '/products').then(function (r) { return r.json() }),
        ])
          .then(function (res) {
            apparence = res[0]
            produits = (res[1] && res[1].products) || []
            nomBoutique = (apparence.boutique && apparence.boutique.nom) || (res[1].shop && res[1].shop.name) || 'Boutique'
            document.title = nomBoutique

            // L'accent du thème marchand teinte les quatre modes visiteur.
            var jetons = apparence.jetons || {}
            if (jetons.primary) document.documentElement.style.setProperty('--accent', jetons.primary)
            if (jetons.accent) document.documentElement.style.setProperty('--accent-2', jetons.accent)

            // Les polices du thème, demandées à Google.
            var familles = (apparence.polices && apparence.polices.familles) || []
            if (familles.length) {
              var l = document.createElement('link')
              l.rel = 'stylesheet'
              l.href = 'https://fonts.googleapis.com/css2?' + familles.map(function (f) { return 'family=' + encodeURIComponent(f).replace(/%20/g, '+') + ':wght@400;600;800' }).join('&') + '&display=swap'
              document.head.appendChild(l)
              if (apparence.polices.titre) document.documentElement.style.setProperty('--display', "'" + apparence.polices.titre + "', " + 'serif')
              if (apparence.polices.texte) document.documentElement.style.setProperty('--sans', "'" + apparence.polices.texte + "', system-ui, sans-serif")
            }

            var enseigne = document.getElementById('enseigne')
            var logo = apparence.boutique && apparence.boutique.logo
            enseigne.innerHTML = (logo ? '<img src="' + texte(logo) + '" alt="" />' : '') + '<span>' + texte(nomBoutique) + '</span>'

            if (apparence.contenu && apparence.contenu.annonce) {
              var bandeau = document.getElementById('annonce')
              bandeau.hidden = false
              bandeau.textContent = apparence.contenu.annonce
            }

            rendrePied()
            route()
          })
          .catch(function () {
            document.getElementById('page').innerHTML = '<p class="chargement">La boutique est momentanément indisponible — réessayez dans un instant.</p>'
          })

        window.addEventListener('hashchange', route)
      })()
    </script>
  </body>
</html>
