<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        width: 340px;
        max-height: 520px;
        overflow-y: auto;
        font: 13px/1.4 system-ui, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 45%, #581c87 100%);
        color: #e5e7eb;
      }
      header { padding: 14px 16px 8px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
      .brand { background: linear-gradient(90deg, #f472b6, #fb923c); -webkit-background-clip: text; background-clip: text; color: transparent; }
      main { padding: 0 16px 16px; }
      input {
        width: 100%; box-sizing: border-box; margin-top: 6px; padding: 7px 9px;
        border-radius: 7px; border: 1px solid rgba(255,255,255,.12);
        background: rgba(255,255,255,.08); color: #fff; outline: none;
      }
      input:focus { border-color: #c084fc; }

      /* Le champ de mot de passe et son oeil, sur la meme ligne. */
      .champ-mdp { position: relative; }
      .champ-mdp input { padding-right: 34px; }
      .oeil {
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        margin-top: -4px;
        border: 0;
        background: transparent;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        padding: 4px 6px;
        opacity: .75;
      }
      .oeil:hover { opacity: 1; }
      form { margin: 0; }
      button.primary {
        width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 7px;
        background: linear-gradient(90deg, #a855f7, #ec4899); color: #fff; font-weight: 600; cursor: pointer;
      }
      .product { border: 1px solid rgba(255,255,255,.1); border-radius: 9px; padding: 9px; margin-bottom: 8px; background: rgba(255,255,255,.05); }
      .product-title { font-weight: 600; font-size: 12px; margin-bottom: 2px; }
      .price { color: #d8b4fe; font-weight: 700; font-size: 12px; }
      .targets { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
      .targets button {
        border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: #e5e7eb;
        border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer;
      }
      .targets button:hover { background: rgba(255,255,255,.14); }
      .muted { color: #9ca3af; font-size: 11px; }
      .site-box {
        border: 1px solid rgba(240,168,30,.45);
        background: rgba(240,168,30,.10);
        border-radius: 10px;
        padding: 11px;
        margin-bottom: 12px;
      }
      .site-box.on { border-color: rgba(52,211,153,.45); background: rgba(52,211,153,.10); }
      .site-title { font-weight: 600; font-size: 12.5px; margin-bottom: 5px; }
      .site-box .muted { line-height: 1.5; }
      .site-box button { width: 100%; margin-top: 9px; padding: 8px; border: 0; border-radius: 7px; font-weight: 600; font-size: 12px; cursor: pointer; }
      .site-box .primary { background: linear-gradient(90deg,#a855f7,#ec4899); color: #fff; }
      .site-box .ghost { background: rgba(255,255,255,.08); color: #e5e7eb; border: 1px solid rgba(255,255,255,.15); }
      .error { color: #f87171; font-size: 11px; margin-top: 6px; }
      .link { color: #d8b4fe; cursor: pointer; text-decoration: underline; font-size: 11px; }
    </style>
  </head>
  <body>
    <header><span class="brand">DropShipper IA</span></header>
    <main id="app"><p class="muted">Chargement…</p></main>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
