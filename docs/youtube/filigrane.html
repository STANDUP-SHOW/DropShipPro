<!doctype html>

<title>Filigrane vidéo YouTube — DropShipper IA</title>

-->

  html, body { margin: 0; width: 150px; height: 150px; overflow: hidden; background: transparent; }
  svg { width: 150px; height: 150px; display: block; }
</style>
</head>

      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="31" fill="url(#fond)"/>
