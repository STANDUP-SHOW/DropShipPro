<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Couverture Facebook — DropShipper IA</title>
<!--
  Couverture de page Facebook, 1640 × 720 : le double de 820 × 360, la seule
  taille qui satisfait les deux recadrages de Facebook à la fois.

  Sur ordinateur la couverture s'affiche en 820 × 312 : Facebook garde la bande
  centrale et rogne 24 px (48 ici) en haut et en bas. Sur téléphone elle
  s'affiche en 640 × 360 : il garde toute la hauteur et rogne 90 px (180 ici)
  de chaque côté. Le nom, le cerveau et l'accroche tiennent donc dans
  l'intersection, 1280 × 624 au centre ; les nuages de pastilles s'étalent sur
  toute la largeur d'ordinateur, et leurs bords sortent du cadre du téléphone —
  c'est un nuage, il déborde.

  Le nuage est dessiné par nuage.js, partagé avec la bannière YouTube ; cette
  page ne donne que sa géométrie. Ouvrir avec « ?guides » pour voir les deux
  cadres, « ?vue=ordinateur » ou « ?vue=telephone » pour voir chaque recadrage.
  Rendu en PNG par `node docs/youtube/rendre.cjs facebook`.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Dancing+Script:wght@700&display=swap">
<link rel="stylesheet" href="nuage.css">
<style>
  html, body { width: 1640px; height: 720px; }
  .scene {
    width: 1640px; height: 720px;
    background:
      radial-gradient(620px 420px at 50% 50%, rgba(192, 38, 211, .3), transparent 70%),
      radial-gradient(1200px 700px at 50% 50%, rgba(76, 29, 149, .32), transparent 74%),
      var(--noir);
  }
  .grille {
    -webkit-mask-image: radial-gradient(1100px 600px at 50% 50%, #000 30%, transparent 85%);
            mask-image: radial-gradient(1100px 600px at 50% 50%, #000 30%, transparent 85%);
  }
  .liens { width: 1640px; height: 720px; }

  /* Les aperçus recadrés : la scène glisse pour que la fenêtre montre le cadre. */
  body.vue-ordinateur .scene { transform: translateY(-48px); }
  body.vue-telephone .scene { transform: translateX(-180px); }

  .marque { top: 118px; gap: 18px; }
  .marque svg { width: 58px; height: 58px; }
  .nom { font-size: 58px; }
  .accroche { top: 556px; font-size: 25px; }
</style>
</head>
<body>
<div class="scene">
  <div class="grille"></div>

  <svg class="liens" viewBox="0 0 1640 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
      <filter id="neon-doux" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
      <filter id="aura" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
      <linearGradient id="trait-cerveau" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f472b6"/><stop offset=".55" stop-color="#e040c8"/><stop offset="1" stop-color="#a855f7"/>
      </linearGradient>
      <radialGradient id="chair-cerveau" cx="50%" cy="50%" r="60%">
        <stop offset="0" stop-color="#ff3ea5" stop-opacity=".55"/>
        <stop offset=".6" stop-color="#c026d3" stop-opacity=".28"/>
        <stop offset="1" stop-color="#6d28d9" stop-opacity=".12"/>
      </radialGradient>
      <linearGradient id="cube-fond" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
      </linearGradient>
    </defs>

    <!-- Les liens, générés par nuage.js. -->
    <g id="halos"></g>
    <g id="traits"></g>
    <g id="paquets"></g>

    <!-- Les anneaux de traitement, autour du cerveau. -->
    <g id="anneaux" fill="none"></g>

    <!-- Le cerveau IA, au centre : 276 × 230 posé sur le canevas, centré en (820, 360). -->
    <svg id="cerveau" x="682" y="245" width="276" height="230" viewBox="0 0 240 200" overflow="visible">
      <g id="silhouette">
        <path id="contour" d="M30 100C12 88 16 60 40 54C40 32 66 18 90 30C100 12 132 10 146 28C168 16 202 28 202 56C226 60 232 92 214 108C228 128 212 154 186 150C182 170 154 180 138 166C128 178 104 178 94 164C72 174 46 160 46 140C24 136 14 112 30 100Z"/>
      </g>
      <use href="#contour" fill="#ff3ea5" opacity=".55" filter="url(#aura)"/>
      <use href="#contour" fill="url(#chair-cerveau)"/>
      <g id="reseau" stroke="rgba(255,255,255,.55)" stroke-width="1.2"></g>
      <g id="neurones"></g>
      <g fill="none" stroke="url(#trait-cerveau)" stroke-width="2.6" stroke-linecap="round" opacity=".9">
        <path d="M118 22C108 60 128 100 116 168"/>
        <path d="M48 70C66 62 64 88 84 84"/>
        <path d="M52 118C72 108 74 136 96 130"/>
        <path d="M78 44C92 50 88 66 104 68"/>
        <path d="M70 150C84 142 96 152 108 146"/>
        <path d="M136 44C152 40 156 62 176 58"/>
        <path d="M140 92C160 84 166 108 190 100"/>
        <path d="M142 132C160 124 168 148 186 138"/>
        <path d="M148 171C150 183 158 190 170 194" opacity=".7"/>
      </g>
      <use href="#contour" fill="none" stroke="#ff3ea5" stroke-width="9" opacity=".7" filter="url(#neon-doux)"/>
      <use href="#contour" fill="none" stroke="url(#trait-cerveau)" stroke-width="4.2" stroke-linejoin="round"/>
      <g transform="translate(97 78)">
        <rect width="46" height="46" rx="12" fill="url(#cube-fond)" filter="url(#neon-doux)" opacity=".9"/>
        <rect width="46" height="46" rx="12" fill="url(#cube-fond)"/>
        <path transform="scale(.36)" d="M64 24L104 46L104 84L64 106L24 84L24 46ZM24 46L64 66L104 46M64 66L64 106" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      </g>
    </svg>
  </svg>

  <!-- Pastilles sources (gauche) et destinations (droite) : posées par nuage.js. -->
  <div id="pastilles"></div>

  <div class="marque">
    <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="cube-marque" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>
      <rect width="128" height="128" rx="33" fill="url(#cube-marque)"/>
      <path d="M64 24L104 46L104 84L64 106L24 84L24 46ZM24 46L64 66L104 46M64 66L64 106" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <div class="nom"><span class="lueur">DropShipper IA</span><span>DropShipper IA</span></div>
  </div>

  <div class="accroche">Du fournisseur à la marketplace, l'IA fait le reste<span class="sep">·</span><b>drop-shipper.fr</b></div>

  <div class="guides" id="guides">
    <div class="guide" style="left:0;top:48px;width:1640px;height:624px;border-color:#38bdf8"><span style="color:#38bdf8;left:8px;top:8px">Ordinateur 1640 × 624 (820 × 312)</span></div>
    <div class="guide" style="left:180px;top:0;width:1280px;height:720px;border-color:#4ade80"><span style="color:#4ade80;top:auto;bottom:8px;left:8px">Téléphone 1280 × 720 (640 × 360)</span></div>
  </div>
</div>

<script src="nuage.js"></script>
<script>
  // Les nuages vivent dans la bande d'ordinateur (48–672), loin du centre, et
  // débordent du cadre du téléphone (180–1460) sur les côtés.
  dessinerNuage({
    GRAINE: 20260911,
    BANDE: { y0: 62, y1: 658 },
    GAUCHE: [28, 610],
    DROITE: [1030, 1612],
    CERVEAU: { cx: 820, cy: 360, rx: 134, ry: 103 },
    EXCLUS: [
      { cx: 820, cy: 360, r: 262 },                      // cerveau + anneaux
      { x0: 560, x1: 1080, y0: 100, y1: 200 },           // la marque
      { x0: 420, x1: 1220, y0: 540, y1: 600 },           // l'accroche
    ],
    TAILLES: { sources: [126, 60], destinations: [104, 46] },
    ANNEAUX: [172, 202, 234],
    EPAISSEUR: { source: 3.2, destination: 2.7 },
  })

  const params = new URLSearchParams(location.search)
  if (params.has('guides')) document.getElementById('guides').classList.add('on')
  if (params.get('vue')) document.body.classList.add('vue-' + params.get('vue'))
</script>
</body>
</html>
