<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bannière YouTube — DropShipper IA</title>
<!--
  Bannière de chaîne YouTube, 2560 × 1440.

  YouTube recadre selon l'écran : la télévision voit tout, l'ordinateur voit une
  bande de 2560 × 423 au centre, la tablette 1855 × 423, le téléphone 1546 × 423.
  Tout ce qui compte (nom, cerveau, accroche) tient donc dans la « zone sûre »
  de 1546 × 423 centrée ; les nuages de pastilles s'étalent dans la bande
  d'ordinateur ; le reste du canevas n'est que décor pour la télévision.

  Les pastilles sont posées en NUAGE : tailles différentes, positions tirées au
  sort (graine fixe, donc le même dessin à chaque rendu — changer GRAINE pour
  un autre tirage), jamais alignées, sans se chevaucher. Chaque pastille est
  reliée au cerveau.

  Logos : ceux du paquet du site (`logo`), ou un fichier déposé dans
  `docs/youtube/logos/` (`local`). Quand ce fichier manque, une pastille de
  repli dessinée ici prend sa place ; déposer le fichier suffit à la remplacer.

  Ouvrir avec « ?guides » pour voir les zones de recadrage superposées, avec
  « ?vue=ordinateur » ou « ?vue=telephone » pour voir la bande telle que YouTube
  la recadre. Rendu en PNG par `node docs/youtube/rendre.cjs`.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Dancing+Script:wght@700&display=swap">
<style>
  :root {
    --noir: #08070f;
    --rose-neon: #ff3ea5;
    --rose: #f472b6;
    --fuchsia: #c026d3;
    --violet: #a855f7;
  }
  html, body { margin: 0; width: 2560px; height: 1440px; overflow: hidden; background: var(--noir); }
  body { font-family: Outfit, system-ui, "Segoe UI", sans-serif; color: #fff; }

  .scene {
    position: relative; width: 2560px; height: 1440px; overflow: hidden;
    background:
      radial-gradient(760px 520px at 50% 50%, rgba(192, 38, 211, .28), transparent 70%),
      radial-gradient(1500px 1000px at 50% 50%, rgba(76, 29, 149, .32), transparent 72%),
      var(--noir);
  }
  /* Trame de points, fondue vers les bords : matière pour la télévision. */
  .grille {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, .09) 1.6px, transparent 1.7px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(1500px 1000px at 50% 50%, #000 25%, transparent 78%);
            mask-image: radial-gradient(1500px 1000px at 50% 50%, #000 25%, transparent 78%);
  }
  .liens { position: absolute; inset: 0; width: 2560px; height: 1440px; }

  /* Les pastilles : disque blanc, liseré et halo à la couleur de leur lien. */
  .pastille {
    position: absolute; transform: translate(-50%, -50%);
    border-radius: 50%; background: #fff; display: grid; place-items: center;
    box-shadow: 0 0 0 2.5px var(--c), 0 0 calc(var(--d) * .18) var(--c), 0 0 calc(var(--d) * .5) color-mix(in srgb, var(--c) 40%, transparent);
  }
  .pastille img, .pastille .repli { width: 78%; height: 78%; object-fit: contain; }
  .pastille.carre img { width: 70%; height: 70%; border-radius: 18%; }
  .repli { display: grid; place-items: center; text-align: center; line-height: 1; overflow: hidden; }
  .repli svg { width: 92%; height: 92%; }
  .repli.mot { font-weight: 900; letter-spacing: -0.02em; }

  /* Les aperçus recadrés : la scène glisse pour que la fenêtre montre la bande. */
  body.vue-ordinateur .scene { transform: translateY(-508px); }
  body.vue-telephone .scene { transform: translate(-507px, -508px); }

  /* La marque : cube + nom en dégradé rose, avec sa lueur en double flouté. */
  .marque {
    position: absolute; left: 50%; top: 538px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 20px; white-space: nowrap;
  }
  .marque svg { width: 62px; height: 62px; filter: drop-shadow(0 0 16px rgba(192, 38, 211, .6)); }
  .nom { position: relative; font-weight: 900; font-size: 62px; line-height: 1; letter-spacing: -0.01em; }
  .nom span {
    background: linear-gradient(120deg, #f472b6 5%, #c026d3 55%, #a855f7 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .nom .lueur { position: absolute; inset: 0; filter: blur(22px); opacity: .55; }

  .accroche {
    position: absolute; left: 50%; top: 868px; transform: translateX(-50%);
    font-size: 28px; font-weight: 500; letter-spacing: .01em; color: #ece9f7; white-space: nowrap;
    text-shadow: 0 2px 18px rgba(0, 0, 0, .6);
  }
  .accroche b { color: var(--rose-neon); font-weight: 700; text-shadow: 0 0 14px rgba(255, 62, 165, .65); }
  .accroche .sep { margin: 0 16px; opacity: .45; }

  /* Les guides de recadrage (uniquement avec ?guides). */
  .guides { display: none; position: absolute; inset: 0; pointer-events: none; }
  .guides.on { display: block; }
  .guide { position: absolute; border: 3px dashed; box-sizing: border-box; }
  .guide span {
    position: absolute; left: 0; top: -34px; padding: 4px 10px; font-size: 22px; font-weight: 700;
    background: #000; border-radius: 6px;
  }
</style>
</head>
<body>
<div class="scene">
  <div class="grille"></div>

  <svg class="liens" id="liens" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
      <filter id="neon-doux" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
      <filter id="aura" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
      <linearGradient id="trait-cerveau" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f472b6"/><stop offset=".55" stop-color="#e040c8"/><stop offset="1" stop-color="#a855f7"/>
      </linearGradient>
      <radialGradient id="chair-cerveau" cx="50%" cy="50%" r="60%">
        <stop offset="0" stop-color="#ff3ea5" stop-opacity=".55"/>
        <stop offset=".6" stop-color="#c026d3" stop-opacity=".28"/>
        <stop offset="1" stop-color="#6d28d9" stop-opacity=".12"/>
      </radialGradient>
      <linearGradient id="cube-fond" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
      </linearGradient>
    </defs>

    <!-- Décor hors bande (visible à la télévision seulement) : traces de circuit. -->
    <g id="circuit" fill="none" stroke="rgba(236,72,153,.16)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></g>

    <!-- Les liens, générés en bas de page. -->
    <g id="halos"></g>
    <g id="traits"></g>
    <g id="paquets"></g>

    <!-- Les anneaux de traitement, autour du cerveau. -->
    <g id="anneaux" fill="none"></g>

    <!-- Le cerveau IA, au centre : 300 × 250 posé sur le canevas. -->
    <svg id="cerveau" x="1130" y="606" width="300" height="250" viewBox="0 0 240 200" overflow="visible">
      <g id="silhouette">
        <path id="contour" d="M30 100C12 88 16 60 40 54C40 32 66 18 90 30C100 12 132 10 146 28C168 16 202 28 202 56C226 60 232 92 214 108C228 128 212 154 186 150C182 170 154 180 138 166C128 178 104 178 94 164C72 174 46 160 46 140C24 136 14 112 30 100Z"/>
      </g>
      <!-- Aura : la silhouette floutée, derrière tout. -->
      <use href="#contour" fill="#ff3ea5" opacity=".55" filter="url(#aura)"/>
      <use href="#contour" fill="url(#chair-cerveau)"/>
      <!-- Réseau de neurones, sous la chair. -->
      <g id="reseau" stroke="rgba(255,255,255,.55)" stroke-width="1.2"></g>
      <g id="neurones"></g>
      <!-- Circonvolutions et scissure. -->
      <g fill="none" stroke="url(#trait-cerveau)" stroke-width="2.6" stroke-linecap="round" opacity=".9">
        <path d="M118 22C108 60 128 100 116 168"/>
        <path d="M48 70C66 62 64 88 84 84"/>
        <path d="M52 118C72 108 74 136 96 130"/>
        <path d="M78 44C92 50 88 66 104 68"/>
        <path d="M70 150C84 142 96 152 108 146"/>
        <path d="M136 44C152 40 156 62 176 58"/>
        <path d="M140 92C160 84 166 108 190 100"/>
        <path d="M142 132C160 124 168 148 186 138"/>
        <path d="M148 171C150 183 158 190 170 194" opacity=".7"/>
      </g>
      <!-- Le contour, en néon : halo flouté puis trait net. -->
      <use href="#contour" fill="none" stroke="#ff3ea5" stroke-width="9" opacity=".7" filter="url(#neon-doux)"/>
      <use href="#contour" fill="none" stroke="url(#trait-cerveau)" stroke-width="4.2" stroke-linejoin="round"/>
      <!-- Le cube de la marque, au cœur. -->
      <g transform="translate(97 78)">
        <rect width="46" height="46" rx="12" fill="url(#cube-fond)" filter="url(#neon-doux)" opacity=".9"/>
        <rect width="46" height="46" rx="12" fill="url(#cube-fond)"/>
        <path transform="scale(.36)" d="M64 24L104 46L104 84L64 106L24 84L24 46ZM24 46L64 66L104 46M64 66L64 106" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      </g>
    </svg>
  </svg>

  <!-- Pastilles sources (gauche) et destinations (droite) : posées par le script. -->
  <div id="pastilles"></div>

  <div class="marque">
    <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="cube-marque" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>
      <rect width="128" height="128" rx="33" fill="url(#cube-marque)"/>
      <path d="M64 24L104 46L104 84L64 106L24 84L24 46ZM24 46L64 66L104 46M64 66L64 106" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <div class="nom"><span class="lueur">DropShipper IA</span><span>DropShipper IA</span></div>
  </div>

  <div class="accroche">Du fournisseur à la marketplace, l'IA fait le reste<span class="sep">·</span><b>drop-shipper.fr</b></div>

  <div class="guides" id="guides">
    <div class="guide" style="left:0;top:0;width:2560px;height:1440px;border-color:#6b7280"><span style="color:#9ca3af;top:8px;left:8px">Télévision 2560 × 1440</span></div>
    <div class="guide" style="left:0;top:508px;width:2560px;height:423px;border-color:#38bdf8"><span style="color:#38bdf8;left:8px">Ordinateur 2560 × 423</span></div>
    <div class="guide" style="left:352px;top:508px;width:1855px;height:423px;border-color:#facc15"><span style="color:#facc15">Tablette 1855 × 423</span></div>
    <div class="guide" style="left:507px;top:508px;width:1546px;height:423px;border-color:#4ade80"><span style="color:#4ade80;top:auto;bottom:-34px">Téléphone / zone sûre 1546 × 423</span></div>
  </div>
</div>

<script>
  const PAQUET = '../../frontend/public/logos/'
  const LOCAL = 'logos/'
  const ROSE = '#ff3ea5'
  const GRAINE = 20260911

  // Sources, à gauche : les fournisseurs de services/suppliers.ts (plus Shein,
  // relevé par l'extension), du plus gros au plus petit, une couleur néon chacun.
  // `logo` = fichier du paquet du site ; `local` = fichier attendu dans
  // docs/youtube/logos/, avec `repli` = dessin de secours tant qu'il manque.
  const NEONS = ['#fb923c', '#22d3ee', '#facc15', '#a3e635', '#a78bfa', '#38bdf8']
  const SOURCES = [
    { local: 'aliexpress.png', repli: 'aliexpress' },
    { logo: 'temu_logo-svg.png', carre: true },
    { local: 'cj.png', repli: 'cj' },
    { local: 'bigbuy.png', repli: { texte: 'BigBuy', couleur: '#1d4ed8' } },
    { logo: 'shein-logo.png' },
    { local: 'alibaba.png', repli: { texte: 'Alibaba', couleur: '#ff6a00' } },
    { logo: 'etsy.png' },
    { local: 'vidaxl.png', repli: { texte: 'vidaXL', couleur: '#f37021' } },
    { logo: 'joom-logo-new.png' },
    { local: 'dhgate.png', repli: { texte: 'DHgate', couleur: '#e8402a' } },
    { local: 'banggood.png', repli: { texte: 'Banggood', couleur: '#ff6a00' } },
    { logo: 'zentrada.png' },
  ].map((p, i) => ({ ...p, c: NEONS[i % NEONS.length] }))

  // Destinations, à droite : uniquement des places de marché de
  // services/platforms.ts (ce que l'application publie vraiment), tout en rose néon.
  const DESTINATIONS = [
    { logo: 'amazon.png' }, { logo: 'tiktokshop_logo.png' }, { logo: 'ebay.png' }, { logo: 'cdiscount-new-logo.png' },
    { local: 'shopify.png', repli: { texte: 'shopify', couleur: '#5e8e3e' } },
    { local: 'vinted.png', repli: { texte: 'vinted', couleur: '#09b1ba' } },
    { local: 'leboncoin.png', repli: { texte: 'leboncoin', couleur: '#ff6e14' } },
    { logo: 'fnac.png' }, { logo: 'googleshoppingads.png' }, { logo: 'laredoute.png' }, { logo: 'eleclerc.png' },
    { logo: 'carrefour.png' }, { logo: 'kaufland_marketplace.png' }, { logo: 'auchan.png' }, { logo: 'boulanger.png' },
    { logo: 'leroymerlin.png' }, { logo: 'but.png' },
    { local: 'wish.png', repli: { texte: 'wish', couleur: '#111', taille: 0.3 } },
    { logo: 'bhvmarais.png' }, { logo: 'kiabi_logo.png' }, { logo: 'showroomprive.png' }, { logo: 'spartoo.png' },
    { logo: 'miintomarketplace.png' }, { logo: 'instagram.png', carre: true }, { logo: 'facebookads.png' }, { logo: 'bol-logo.png' },
    { logo: 'galerieslafayette.png' }, { logo: 'maisonsdumonde.png' }, { logo: '1200px-media_markt_logo-svg.png' }, { logo: 'ldlc.png' },
  ].map((p) => ({ ...p, c: ROSE }))

  // Tailles décroissantes : les premières pastilles sont les plus grosses.
  const taille = (i, n, max, min) => Math.round(max - (i * (max - min)) / Math.max(1, n - 1))
  SOURCES.forEach((p, i) => (p.d = taille(i, SOURCES.length, 156, 70)))
  DESTINATIONS.forEach((p, i) => (p.d = taille(i, DESTINATIONS.length, 128, 54)))

  // Tirage au sort reproductible (mulberry32).
  const alea = (() => { let a = GRAINE; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } })()

  // Les nuages vivent dans la bande d'ordinateur (508–931), loin du centre.
  const BANDE = { y0: 520, y1: 920 }
  const CERVEAU = { cx: 1280, cy: 731 }
  const EXCLUS = [
    { cx: CERVEAU.cx, cy: CERVEAU.cy, r: 292 },          // cerveau + anneaux
    { x0: 940, x1: 1620, y0: 512, y1: 622 },            // la marque
    { x0: 840, x1: 1730, y0: 850, y1: 910 },            // l'accroche (858 → 1702 px)
  ]
  function placer(liste, x0, x1, poses) {
    for (const p of liste) {
      let d = p.d, place = false
      for (let essai = 0; essai < 20000 && !place; essai++) {
        if (essai && essai % 2500 === 0 && d > 44) d = Math.round(d * 0.93)
        const r = d / 2
        const x = x0 + r + alea() * (x1 - x0 - d)
        const y = BANDE.y0 + r + alea() * (BANDE.y1 - BANDE.y0 - d)
        const heurte = EXCLUS.some((e) => 'r' in e ? Math.hypot(x - e.cx, y - e.cy) < e.r + r : x + r > e.x0 && x - r < e.x1 && y + r > e.y0 && y - r < e.y1)
        if (heurte) continue
        if (poses.some((q) => Math.hypot(x - q.x, y - q.y) < r + q.d / 2 + 14)) continue
        Object.assign(p, { x, y, d })
        poses.push(p)
        place = true
      }
      if (!place) document.title = 'PASTILLE SANS PLACE : ' + (p.logo || p.local)
    }
  }
  const poses = []
  placer(SOURCES, 48, 1000, poses)
  placer(DESTINATIONS, 1560, 2512, poses)

  // Où les flux touchent le cerveau : sur une ellipse qui épouse son contour,
  // répartis dans l'ordre vertical des pastilles pour que les liens ne se croisent pas.
  const surCerveau = (liste, angleDebut, angleFin) => {
    const tri = [...liste].sort((a, b) => a.y - b.y)
    tri.forEach((p, i) => {
      const t = tri.length === 1 ? 0.5 : i / (tri.length - 1)
      const a = ((angleDebut + (angleFin - angleDebut) * t) * Math.PI) / 180
      p.ancre = [CERVEAU.cx + 146 * Math.cos(a), CERVEAU.cy + 112 * Math.sin(a)]
    })
  }
  surCerveau(SOURCES, 232, 128)     // bord gauche, de haut en bas
  surCerveau(DESTINATIONS, -56, 56) // bord droit, de haut en bas

  const NS = 'http://www.w3.org/2000/svg'
  const el = (tag, attrs) => {
    const n = document.createElementNS(NS, tag)
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v)
    return n
  }
  const halos = document.getElementById('halos')
  const traits = document.getElementById('traits')
  const paquets = document.getElementById('paquets')

  const courbe = ([x0, y0], [x1, y1]) => {
    const dx = (x1 - x0) * 0.5
    return `M${x0} ${y0}C${x0 + dx} ${y0} ${x1 - dx} ${y1} ${x1} ${y1}`
  }

  function lien(depart, arrivee, couleur, graine, epaisseur) {
    const d = courbe(depart, arrivee)
    halos.append(el('path', { d, fill: 'none', stroke: couleur, 'stroke-width': epaisseur * 3, opacity: .5, filter: 'url(#neon)', 'stroke-linecap': 'round' }))
    traits.append(el('path', { d, fill: 'none', stroke: couleur, 'stroke-width': epaisseur, 'stroke-linecap': 'round' }))
    const coeur = el('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': 1.2, opacity: .7, 'stroke-linecap': 'round' })
    traits.append(coeur)
    // Les paquets de données qui circulent, figés à des positions décalées par lien.
    const L = coeur.getTotalLength()
    for (const t of [0.3, 0.68]) {
      const p = coeur.getPointAtLength(((t + graine * 0.045) % 1) * L)
      paquets.append(el('circle', { cx: p.x, cy: p.y, r: 9, fill: couleur, opacity: .5, filter: 'url(#neon-doux)' }))
      paquets.append(el('circle', { cx: p.x, cy: p.y, r: 4.2, fill: '#fff' }))
    }
    // La pointe, à l'arrivée.
    const fin = coeur.getPointAtLength(L)
    const avant = coeur.getPointAtLength(L - 10)
    const a = (Math.atan2(fin.y - avant.y, fin.x - avant.x) * 180) / Math.PI
    const pointe = 'M-12 -7L3 0L-12 7Z'
    paquets.append(el('path', { d: pointe, fill: couleur, transform: `translate(${fin.x} ${fin.y}) rotate(${a})`, filter: 'url(#neon-doux)' }))
    paquets.append(el('path', { d: pointe, fill: couleur, transform: `translate(${fin.x} ${fin.y}) rotate(${a})` }))
  }

  // Le point de départ d'un lien : sur le bord de la pastille, face au cerveau.
  const bord = (p, cible) => {
    const a = Math.atan2(cible[1] - p.y, cible[0] - p.x)
    return [p.x + (p.d / 2 - 3) * Math.cos(a), p.y + (p.d / 2 - 3) * Math.sin(a)]
  }
  SOURCES.forEach((p, i) => lien(bord(p, p.ancre), p.ancre, p.c, i, 3.6))
  DESTINATIONS.forEach((p, i) => lien(p.ancre, bord(p, p.ancre), p.c, i + 10, 3))

  // Les dessins de secours, quand le fichier local manque : deux icônes
  // redessinées, sinon le nom de la marque dans sa couleur.
  const REPLIS = {
    aliexpress: () => `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#f0432b"/><path d="M0 22V22C0 10 10 0 22 0H78C90 0 100 10 100 22Z" fill="#ff9d00"/><path d="M31 36V44A19 19 0 0 0 69 44V36" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/><text x="50" y="84" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff" font-family="Outfit,sans-serif">AliExpress</text></svg>`,
    cj: () => `<svg viewBox="0 0 100 100"><defs><linearGradient id="cj-fond" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7a21b"/><stop offset="1" stop-color="#e8641b"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#cj-fond)"/><text x="50" y="70" text-anchor="middle" font-size="58" fill="#fff" font-family="'Dancing Script',cursive" font-weight="700">CJ</text></svg>`,
  }
  const fabriqueRepli = (repli, d) => {
    const div = document.createElement('div')
    if (typeof repli === 'string') {
      div.className = 'repli'
      div.innerHTML = REPLIS[repli]()
    } else {
      // Un mot : sa taille se règle sur sa longueur pour remplir la pastille.
      div.className = 'repli mot'
      const taille = repli.taille ?? Math.min(0.3, 1.25 / repli.texte.length)
      div.style.cssText = `color:${repli.couleur};font-size:${Math.round(d * taille)}px`
      div.textContent = repli.texte
    }
    return div
  }

  // Les pastilles.
  const conteneur = document.getElementById('pastilles')
  for (const p of [...SOURCES, ...DESTINATIONS]) {
    const div = document.createElement('div')
    div.className = 'pastille' + (p.carre ? ' carre' : '')
    div.style.cssText = `left:${p.x}px;top:${p.y}px;width:${p.d}px;height:${p.d}px;--c:${p.c};--d:${p.d}px`
    const img = document.createElement('img')
    img.src = (p.local ? LOCAL + p.local : PAQUET + p.logo)
    img.alt = ''
    if (p.repli) img.onerror = () => img.replaceWith(fabriqueRepli(p.repli, p.d))
    div.append(img)
    conteneur.append(div)
  }

  // Les neurones du cerveau (repère 240 × 200 du cerveau).
  const NEURONES = [[60, 80], [84, 58], [100, 112], [72, 132], [94, 152], [52, 108], [140, 66], [172, 80], [152, 118], [192, 118], [168, 150], [130, 152], [118, 56], [206, 92], [40, 90], [120, 178]]
  const ARETES = [[0, 1], [0, 5], [1, 12], [2, 3], [2, 5], [3, 4], [4, 11], [6, 12], [6, 7], [7, 13], [7, 8], [8, 9], [9, 10], [10, 11], [8, 11], [14, 0], [14, 5], [12, 2], [6, 8], [15, 11], [15, 4]]
  const reseau = document.getElementById('reseau')
  const neurones = document.getElementById('neurones')
  for (const [a, b] of ARETES) {
    reseau.append(el('line', { x1: NEURONES[a][0], y1: NEURONES[a][1], x2: NEURONES[b][0], y2: NEURONES[b][1] }))
  }
  NEURONES.forEach(([x, y], i) => {
    neurones.append(el('circle', { cx: x, cy: y, r: 5, fill: ROSE, opacity: .8, filter: 'url(#neon-doux)' }))
    neurones.append(el('circle', { cx: x, cy: y, r: i % 3 === 0 ? 3.2 : 2.4, fill: '#fff' }))
  })

  // Les anneaux de traitement autour du cerveau (repère de la page).
  const anneaux = document.getElementById('anneaux')
  const { cx, cy } = CERVEAU
  ;[[190, .55, '10 14', 3], [222, .35, '3 22', 2.5], [258, .22, '40 30', 2]].forEach(([r, o, dash, w], i) => {
    anneaux.append(el('circle', { cx, cy, r, stroke: ROSE, 'stroke-width': w, 'stroke-dasharray': dash, opacity: o, transform: `rotate(${i * 37} ${cx} ${cy})` }))
  })
  ;[[190, 20], [190, 200], [222, 110], [222, 290], [258, 60], [258, 250]].forEach(([r, deg]) => {
    const x = cx + r * Math.cos((deg * Math.PI) / 180), y = cy + r * Math.sin((deg * Math.PI) / 180)
    anneaux.append(el('circle', { cx: x, cy: y, r: 10, fill: ROSE, opacity: .5, filter: 'url(#neon-doux)' }))
    anneaux.append(el('circle', { cx: x, cy: y, r: 4, fill: '#fff' }))
  })

  // Traces de circuit dans les zones que seule la télévision montre.
  const circuit = document.getElementById('circuit')
  const TRACES = [
    'M120 120H520L600 200H900L960 260H1180', 'M2440 120H2040L1960 200H1660L1600 260H1380',
    'M120 1320H560L640 1240H920L980 1180H1180', 'M2440 1320H2000L1920 1240H1640L1580 1180H1380',
    'M260 300V420', 'M2300 300V420', 'M260 1140V1020', 'M2300 1140V1020',
    'M1280 60V300', 'M1280 1380V1140', 'M760 80V160H1040', 'M1800 80V160H1520', 'M760 1360V1280H1040', 'M1800 1360V1280H1520',
  ]
  for (const d of TRACES) circuit.append(el('path', { d }))
  ;[[120, 120], [2440, 120], [120, 1320], [2440, 1320], [1180, 260], [1380, 260], [1180, 1180], [1380, 1180], [1280, 60], [1280, 1380], [260, 420], [2300, 420], [260, 1020], [2300, 1020], [1040, 160], [1520, 160], [1040, 1280], [1520, 1280]]
    .forEach(([x, y]) => circuit.append(el('circle', { cx: x, cy: y, r: 6, fill: 'rgba(236,72,153,.35)', stroke: 'none' })))

  const params = new URLSearchParams(location.search)
  if (params.has('guides')) document.getElementById('guides').classList.add('on')
  if (params.get('vue')) document.body.classList.add('vue-' + params.get('vue'))
</script>
</body>
</html>
