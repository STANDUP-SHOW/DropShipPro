name: DropShipper Desktop — installateur Windows

# Builds the installers of DropShipper Desktop (desktop/, the seller's app,
# linked to drop-shipper.fr with a dsp_live_ key) on a Windows runner, after the
# logic bench, and publishes them as the artifact "installateur-desktop" and on
# the pre-release "desktop-dernier". Independent from the Poste d'analyses
# (analyses/, release poste-analyses-dernier), which this workflow never touches.
on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installateur:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Banc de la logique
        run: npm run check
      - name: Installateurs NSIS et MSI
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: installateur-desktop
          path: |
            desktop/dist/*.exe
            desktop/dist/*.msi
          retention-days: 30
      # Same guard as the Poste: a branch carrying an older desktop/ must not
      # replace a newer published version.
      - name: Comparer à la version publiée
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          locale=$(node -p "require('./package.json').version")
          publiee=$(gh release view desktop-dernier --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null \
            | sed -n 's/.*Version \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' | head -1)
          echo "locale=$locale" >> "$GITHUB_OUTPUT"
          if [ -n "$publiee" ] && ! node -e '
            const n = v => v.split(".").map(Number);
            const [a, b] = [n(process.argv[1]), n(process.argv[2])];
            for (let i = 0; i < 3; i++) if ((a[i] || 0) !== (b[i] || 0)) process.exit((a[i] || 0) > (b[i] || 0) ? 0 : 1);
          ' "$locale" "$publiee"; then
            echo "::notice::Version $locale plus ancienne que la $publiee publiée : release laissée telle quelle."
            echo "publier=non" >> "$GITHUB_OUTPUT"
          else
            echo "publier=oui" >> "$GITHUB_OUTPUT"
          fi
      - name: Publier / remplacer la pré-version « desktop-dernier »
        if: steps.version.outputs.publier == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-dernier --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          cp dist/*Setup*.exe "dist/DropShipper-Desktop-Setup.exe"
          gh release create desktop-dernier "dist/DropShipper-Desktop-Setup.exe" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "DropShipper Desktop — dernier installateur (non signé)" \
            --notes "Version ${{ steps.version.outputs.locale }}. Installateur Windows de DropShipper Desktop (application du vendeur), construit à partir du commit $GITHUB_SHA. Se relie au compte drop-shipper.fr par la connexion au site dans la fenêtre, ou par une clé dsp_live_ créée dans Réglages. Non signé : Windows SmartScreen affichera « Éditeur inconnu » (Informations complémentaires › Exécuter quand même)."
