name: KANTIX ANALYSER (Poste d'analyses) — installateur Windows

# Builds the installer of the Poste d'analyses (analyses/) on a Windows runner,
# runs both benches first, and publishes the .exe as a pre-release that Max can
# download with one click. Nothing here touches the site, the API or the database.
on:
  push:
    paths: ['analyses/**', '.github/workflows/poste-analyses-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installateur:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: analyses
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analyses/package-lock.json
      - run: npm ci
      - name: Banc de la logique (faux Serper, faux Claude)
        run: npm run check
      - name: Banc de la vraie fenêtre Electron
        run: npm run check:fenetre
      - name: Installateur NSIS
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: installateur-windows
          path: analyses/dist/*.exe
          retention-days: 30
      # Any branch that touches analyses/ runs this workflow, including branches
      # carrying an older copy of analyses/ (12/10: a front-end branch put 0.1.0
      # back over 0.3.5). Publish only if this build is not older than the
      # version already on the release (read from its notes).
      - name: Comparer à la version publiée
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          locale=$(node -p "require('./package.json').version")
          publiee=$(gh release view poste-analyses-dernier --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null \
            | sed -n 's/.*Version \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' | head -1)
          echo "locale=$locale" >> "$GITHUB_OUTPUT"
          if [ -n "$publiee" ] && ! node -e '
            const n = v => v.split(".").map(Number);
            const [a, b] = [n(process.argv[1]), n(process.argv[2])];
            for (let i = 0; i < 3; i++) if ((a[i] || 0) !== (b[i] || 0)) process.exit((a[i] || 0) > (b[i] || 0) ? 0 : 1);
          ' "$locale" "$publiee"; then
            echo "::notice::Version $locale plus ancienne que la $publiee publiée : release laissée telle quelle."
            echo "publier=non" >> "$GITHUB_OUTPUT"
          else
            echo "publier=oui" >> "$GITHUB_OUTPUT"
          fi
      - name: Publier / remplacer la pré-version « poste-analyses-dernier »
        if: steps.version.outputs.publier == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete poste-analyses-dernier --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          cp dist/*Setup*.exe "dist/KANTIX-ANALYSER-Setup.exe"
          gh release create poste-analyses-dernier "dist/KANTIX-ANALYSER-Setup.exe" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "KANTIX ANALYSER (ex-Poste d'analyses) — dernier installateur (non signé)" \
            --notes "Version ${{ steps.version.outputs.locale }}. Installateur Windows de KANTIX ANALYSER (ex-Poste d'analyses ; installé par-dessus, il garde clés, réglages et sessions), construit à partir du commit $GITHUB_SHA. Non signé : Windows SmartScreen affichera « Éditeur inconnu » (Informations complémentaires › Exécuter quand même)."
